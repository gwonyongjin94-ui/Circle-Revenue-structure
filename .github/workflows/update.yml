name: update

# 미 증시 마감 뒤에 돌린다 (22:30 UTC = 18:30 ET). 주가·발행잔액·금리가
# 그날 값으로 채워진 다음이라야 스냅샷이 하루를 온전히 담는다.
on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 한글 폰트 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum
          # matplotlib이 새로 설치된 폰트를 찾도록 캐시를 비운다
          rm -rf ~/.cache/matplotlib

      - name: 차트·스냅샷 재생성
        env:
          # SEC는 요청마다 연락처가 담긴 User-Agent를 요구한다
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          PYTHON: python
        run: ./update.sh

      - name: 변경분 커밋
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets SNAPSHOT.md
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          summary=$(sed -n 's/^| CRCL | \(.*\) |$/\1/p' SNAPSHOT.md | head -1)
          git commit -m "chore: 자동 갱신 ${summary:-$(date -u +%Y-%m-%d)}" \
                     -m "update.sh 실행 결과. 데이터 출처: DefiLlama · FRED · SEC EDGAR · Yahoo Finance"
          git push
